<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    lorry.fm — Highway anthems from the back of a Tata 407
  </title>

  <meta
    name="description"
    content="lorry.fm — the horn-honking, dhaba-stop anthems that blast out of every decorated Indian truck cabin."
  >

  <!-- Favicon -->
  <link
    rel="icon"
    href="favicon.svg"
    type="image/svg+xml"
  >

  <link
    rel="icon"
    href="favicon-32.png"
    sizes="32x32"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="favicon-192.png"
  >

  <meta
    name="theme-color"
    content="#09080b"
  >


  <!-- =====================================================
       OPEN GRAPH
       ===================================================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="lorry.fm"
  >

  <meta
    property="og:title"
    content="LORRY.FM"
  >

  <meta
    property="og:description"
    content="Highway anthems from the back of a Tata 407."
  >

  <meta
    property="og:image"
    content="og-image.png"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:image:alt"
    content="LORRY.FM — highway truck radio"
  >


  <!-- =====================================================
       FONTS
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <!-- Main CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       BACKGROUND SCENE
       ===================================================== -->

  <div
    class="background"
    aria-hidden="true"
  >

    <!-- Sky -->

    <div class="sky"></div>


    <!-- Sun -->

    <div class="sun"></div>


    <!-- Clouds -->

    <div class="cloud cloud-one"></div>

    <div class="cloud cloud-two"></div>


    <!-- =================================================
         FLYING BIRDS
         ================================================= -->

    <div
      class="birds birds-one"
      aria-hidden="true"
    >

      <span></span>
      <span></span>
      <span></span>

    </div>


    <div
      class="birds birds-two"
      aria-hidden="true"
    >

      <span></span>
      <span></span>
      <span></span>

    </div>


    <div
      class="birds birds-three"
      aria-hidden="true"
    >

      <span></span>
      <span></span>
      <span></span>

    </div>


    <!-- =================================================
         MOUNTAINS
         ================================================= -->

    <div class="mountains mountain-one"></div>

    <div class="mountains mountain-two"></div>


    <!-- =================================================
         ROAD
         ================================================= -->

    <div class="road"></div>


    <!-- Road lights -->

    <div class="road-light light-one"></div>

    <div class="road-light light-two"></div>

    <div class="road-light light-three"></div>


    <!-- =================================================
         MAIN MOVING TRUCK
         LEFT → RIGHT
         ================================================= -->

    <div class="moving-truck">


      <!-- Cargo/body -->

      <div class="moving-truck-body">

        <div class="truck-decoration-top"></div>


        <div class="moving-truck-art">
          HORN<br>
          OK<br>
          PLEASE
        </div>


        <div class="truck-art-stripe"></div>


        <div class="truck-cargo-pattern">
          ◆ ◆ ◆ ◆ ◆
        </div>

      </div>


      <!-- Cabin -->

      <div class="moving-truck-cabin">

        <div class="moving-truck-window"></div>

        <div class="moving-truck-front-window"></div>

        <div class="moving-truck-grille"></div>

        <div class="moving-truck-light"></div>

        <div class="truck-bumper"></div>

      </div>


      <!-- Wheels -->

      <div
        class="moving-wheel moving-wheel-one"
      ></div>


      <div
        class="moving-wheel moving-wheel-two"
      ></div>


      <!-- Headlight -->

      <div class="headlight-glow"></div>

    </div>


    <!-- =================================================
         SECOND MOVING TRUCK
         RIGHT → LEFT
         SAME DESIGN
         ================================================= -->

    <div class="moving-truck moving-truck-two">


      <!-- Cargo/body -->

      <div class="moving-truck-body">

        <div class="truck-decoration-top"></div>


        <div class="moving-truck-art">
          HORN<br>
          OK<br>
          PLEASE
        </div>


        <div class="truck-art-stripe"></div>


        <div class="truck-cargo-pattern">
          ◆ ◆ ◆ ◆ ◆
        </div>

      </div>


      <!-- Cabin -->

      <div class="moving-truck-cabin">

        <div class="moving-truck-window"></div>

        <div class="moving-truck-front-window"></div>

        <div class="moving-truck-grille"></div>

        <div class="moving-truck-light"></div>

        <div class="truck-bumper"></div>

      </div>


      <!-- Wheels -->

      <div
        class="moving-wheel moving-wheel-one"
      ></div>


      <div
        class="moving-wheel moving-wheel-two"
      ></div>


      <div class="headlight-glow"></div>

    </div>


    <!-- =================================================
         DUST
         ================================================= -->

    <div class="dust dust-one"></div>

    <div class="dust dust-two"></div>

    <div class="dust dust-three"></div>


    <!-- =================================================
         HIGHWAY DHABA
         ================================================= -->

    <div class="dhaba">

      <span>
        HIGHWAY
      </span>

      <strong>
        DHABA
      </strong>

    </div>


    <!-- Power line -->

    <div class="power-line"></div>

  </div>


  <!-- =====================================================
       TOP BAR
       ===================================================== -->

  <header class="topbar">


    <!-- Left side -->

    <div class="top-left">


      <span class="clock-icon">
        ◷
      </span>


      <span id="liveClock">
        --:--
      </span>


      <span class="top-dot">
        ●
      </span>


      <span>
        LORRY.FM
      </span>


      <span class="top-dot">
        ●
      </span>


      <span class="highway-text">
        LIVE FROM THE HIGHWAY
      </span>

    </div>


    <!-- GitHub -->

    <div class="top-right">

      <a
        href="https://github.com/cgupta21/lorry-fm"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link github-link"
      >

        <span class="github-icon">
          ◉
        </span>

        GITHUB

      </a>

    </div>

  </header>


  <!-- =====================================================
       HERO
       ===================================================== -->

  <section class="hero">


    <p class="eyebrow">
      NOW BLARING FROM EVERY DASHBOARD
    </p>


    <h1>
      LORRY.FM
    </h1>

  </section>


  <!-- =====================================================
       HAZARD STRIPE
       ===================================================== -->

  <div class="hazard-rail">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>


  <!-- =====================================================
       ROTATING HINDI QUOTE
       ===================================================== -->

  <div class="player-quote">

    <p id="rotatingLine">
      हॉर्न बजा के रस्ता दे भाई, आगे निकलनी है हमारी गाड़ी।
    </p>

  </div>


  <!-- =====================================================
       FLOATING HORN CONTROLS
       ===================================================== -->

  <div
    class="horn-row"
    role="group"
    aria-label="Play a horn sound"
  >


    <!-- Horn 1 -->

    <button
      type="button"
      class="horn-btn h1"
      id="hornBtn1"
      aria-label="Horn sound 1"
    >

      <span class="horn-symbol">
        📯
      </span>

      <small>
        HORN 1
      </small>

    </button>


    <!-- Horn 2 -->

    <button
      type="button"
      class="horn-btn h2"
      id="hornBtn2"
      aria-label="Horn sound 2"
    >

      <span class="horn-symbol">
        📯
      </span>

      <small>
        HORN 2
      </small>

    </button>


    <!-- Horn 3 -->

    <button
      type="button"
      class="horn-btn h3"
      id="hornBtn3"
      aria-label="Horn sound 3"
    >

      <span class="horn-symbol">
        📯
      </span>

      <small>
        HORN 3
      </small>

    </button>

  </div>


  <!-- =====================================================
       FLOATING MUSIC PLAYER
       ===================================================== -->

  <main class="player-area">


    <div
      class="dashboard panel"
      id="panel"
    >


      <!-- =================================================
           PLAYER CONTENT
           ================================================= -->

      <div class="player-content">


        <!-- Cover -->

        <div class="cover-frame">


          <div class="cover">

            <img
              id="coverImg"
              alt="Album art for the currently playing song"
            >

          </div>

        </div>


        <!-- =================================================
             SONG INFORMATION
             ================================================= -->

        <div class="meta">


          <!-- Track -->

          <p
            class="track"
            id="trackTitle"
          >
            Chand Se Parda Kijiye
          </p>


          <!-- Artist -->

          <p
            class="artist"
            id="trackArtist"
          >
            Kumar Sanu
          </p>


          <!-- =================================================
               SEEK BAR
               ================================================= -->

          <div
            class="seekbar"
            id="seekbar"
            role="slider"
            tabindex="0"
            aria-label="Seek within song"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >


            <div
              class="seekfill"
              id="seekfill"
            ></div>


            <div
              class="seekthumb"
              id="seekthumb"
            ></div>

          </div>


          <!-- Time -->

          <div class="seektimes">

            <span id="curTime">
              0:00
            </span>

            <span id="durTime">
              0:00
            </span>

          </div>


          <!-- =================================================
               PLAYER CONTROLS
               ================================================= -->

          <div class="controls">


            <!-- Previous -->

            <button
              type="button"
              class="btn small"
              id="prevbtn"
              aria-label="Previous track"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M6 6h2v12H6zM20 6L10 12l10 6z"
                />

              </svg>

            </button>


            <!-- Play / Pause -->

            <button
              type="button"
              class="playbtn"
              id="playbtn"
              aria-label="Play"
              aria-pressed="false"
            >


              <!-- Play icon -->

              <svg
                class="icon-play"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M8 5v14l11-7z"
                />

              </svg>


              <!-- Pause icon -->

              <svg
                class="icon-pause"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M6 5h4v14H6zM14 5h4v14h-4z"
                />

              </svg>

            </button>


            <!-- Next -->

            <button
              type="button"
              class="btn small"
              id="nextbtn"
              aria-label="Next track"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M16 6h2v12h-2zM4 6l10 6-10 6z"
                />

              </svg>

            </button>


            <!-- Equalizer -->

            <div
              class="eq"
              id="eq"
              aria-hidden="true"
            >

              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- =====================================================
       AUDIO ELEMENT
       ===================================================== -->

  <audio
    id="track"
    preload="none"
  ></audio>


  <!-- =====================================================
       EXISTING JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>


</body>

</html>
